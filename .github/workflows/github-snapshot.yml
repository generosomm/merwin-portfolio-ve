name: Refresh GitHub snapshot

# Saves the latest contribution data for the Stack section's GitHub
# graph (data/github-contributions.json) once a day, so new activity
# shows up without a manual run.
on:
  schedule:
    - cron: "0 16 * * *" # 00:00 Manila time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/update-github-snapshot.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/github-contributions.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-contributions.json
          git commit -m "chore(github): refresh contribution snapshot"
          git push
