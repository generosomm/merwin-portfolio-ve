  <script>
    /* Runs before first paint so the render screen never flashes the
       page behind it, and the hero never flashes its final layout. */
    (() => {
      const root = document.documentElement;
      root.classList.toggle("in-hero", !location.hash || location.hash === "#hero");
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      root.classList.add("hero-armed");

      /* The render screen shows on every visit, phones included. It's
         short (0.85 s minimum) and doubles as the wait for the live
         stats, capped at 2 s (js/site.js). Visitors who ask for reduced
         motion skip it entirely (the return above). */
      root.classList.add("preloading");
    })();
  </script>

  <!-- Nothing appears until content.js has run with the site's data,
       so both are fetched early, right after the render-blocking CSS:
       the script at high priority (a deferred script is otherwise low),
       and all the content in one file, data/site.json, built from the
       individual data/*.json files by scripts/build-data.mjs. -->
  <link rel="preload" href="js/content.js?v=r69" as="script" fetchpriority="high">
  <link rel="preload" href="data/site.json" as="fetch" crossorigin>


  <!-- Resolves the bare "three" imports in js/scene/. Inert unless the
       3D scene is switched on in data/scene.json (it is off). -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <!-- Deferred scripts run in document order once the HTML is parsed.
       Lenis, GSAP and ScrollTrigger are local copies (vendor/), same
       versions as before. -->
  <script src="js/content.js?v=r69" defer></script>
  <script src="js/site.js?v=r69" defer></script>
  <script src="js/interactions.js?v=r69" defer></script>

  <script src="js/notes.js?v=r69" defer></script>

  <!-- Vercel Web Analytics: private visitor stats in the Vercel

  <script>

  <script defer src="/_vercel/insights/script.js"></script>
