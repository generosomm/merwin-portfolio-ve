<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="robots" content="index, follow">
  <script>
    (() => {
      document.documentElement.classList.add("liquid-glass");

      try {
        const loaderSessionKey = "ero-visuals-loader-seen";
        if (sessionStorage.getItem(loaderSessionKey)) return;

        sessionStorage.setItem(loaderSessionKey, "true");
        document.documentElement.classList.add("loader-pending");

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        window.setTimeout(() => {
          document.documentElement.classList.add("loader-exiting");
        }, reduceMotion ? 120 : 880);
        window.setTimeout(() => {
          document.documentElement.classList.remove("loader-pending", "loader-exiting");
        }, reduceMotion ? 260 : 1120);
      } catch {
        // Skip the session loader when browser storage is unavailable.
      }
    })();
  </script>

  <meta name="description" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23050505'/><text x='50' y='68' font-size='54' font-family='Arial,sans-serif' font-weight='700' fill='white' text-anchor='middle'>M</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260814-24">
  <script src="js/content.js?v=20260814-7" defer></script>
  <script src="js/app.js?v=20260814-13" defer></script>
</head>

    </div>

    <section class="section about" id="about" aria-labelledby="about-title">
      <div class="about-layout" data-content="about"></div>
      <section class="credentials" data-content="credentials" aria-labelledby="credentials-title"></section>
