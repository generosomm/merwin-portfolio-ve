<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a09">
  <meta name="robots" content="index, follow">
  <script>
    (() => {
      document.documentElement.classList.add("editorial-cut");

      try {
        const loaderSessionKey = "ero-visuals-loader-seen";
        if (sessionStorage.getItem(loaderSessionKey)) return;

        sessionStorage.setItem(loaderSessionKey, "true");
        document.documentElement.classList.add("loader-pending");

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        window.setTimeout(() => {
          document.documentElement.classList.add("loader-exiting");
        }, reduceMotion ? 100 : 460);
        window.setTimeout(() => {
          document.documentElement.classList.remove("loader-pending", "loader-exiting");
        }, reduceMotion ? 200 : 720);
      } catch {
        // Skip the session loader when browser storage is unavailable.
      }
    })();
  </script>
